- title: Molecular mechanisms of memory formation
  subtitle: How AMPA receptors are delivered to the synapse
  group: featured
  image: images/schematic.png
  description:
    Long-term potentiation depends on increasing the number of AMPA receptors at
    the synapse, a job carried out by a molecular machine built from several
    proteins. We combine single-particle cryo-electron microscopy, computational
    structural biology, an in vitro fusion assay, and cell imaging to determine
    how that machine is arranged and how it is regulated.
  tags:
    - cryo-EM
    - synaptic biology

- title: Improving biology education
  subtitle: Generative AI and course-based research experiences
  group: featured
  image: images/projects/genai-blooms.png
  description:
    Assessing the impact of generative AI on science education, and designing and
    assessing course-based undergraduate research experiences that teach
    transferrable molecular biology skills. Students working on these projects
    learn to collect and analyze qualitative data.
  tags:
    - science education
    - generative AI
